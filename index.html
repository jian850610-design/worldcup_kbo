<!DOCTYPE html>
<html lang="ko">
<head>

  <title>야구선수 이상형 월드컵</title>
  <style>
    :root { color-scheme: light; --red: #d52340; --ink: #202827; --muted: #74807d; --line: #dce3df; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; color: var(--ink); background: repeating-linear-gradient(90deg, transparent 0 79px, #173d2704 79px 80px), #f5f7f6; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }

    button:focus-visible { outline: 3px solid #228562; outline-offset: 5px; }
    main { max-width: 860px; padding: 32px 24px; margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; }
    .ball { width: 25px; height: 25px; border-radius: 50%; border: 1px solid #d5dad7; background: #fff; position: relative; overflow: hidden; }
    .ball::before, .ball::after { content: ""; position: absolute; width: 19px; height: 28px; top: -3px; border: 2px dashed var(--red); border-radius: 50%; }
    .ball::before { left: -12px; } .ball::after { right: -12px; }
    .edition { color: var(--muted); font: 11px Georgia, serif; }
    .heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 30px 0 20px; }
    .heading > div:first-child { min-width: 0; }
    .round { color: var(--red); font-size: 52px; line-height: 1.15; font-weight: 900; margin: 0 0 10px; letter-spacing: 0; overflow-wrap: anywhere; }
    .heading #title { font-size: 18px; margin: 0; color: var(--muted); overflow-wrap: anywhere; }
    .counter { color: var(--muted); font: bold 15px "Courier New", monospace; white-space: nowrap; }
    .progress { height: 3px; background: #e0e6e2; margin-bottom: 24px; }
    .progress span { display: block; height: 100%; background: var(--red); transition: width .15s ease; }
    .match-area { position: relative; }
    .match { display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr); align-items: start; }
    .versus { text-align: center; font: italic bold 36px/1.2 Georgia, serif; color: var(--red); }
    .player { padding: 0; min-width: 0; text-align: left; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: white; transition: border-color .15s, box-shadow .15s; }
    .player:hover { border-color: var(--red); box-shadow: 0 8px 24px #172c2510; }
    .portrait { position: relative; display: block; aspect-ratio: 1 / 1; background: repeating-linear-gradient(135deg, transparent 0 36px, #ffffff60 36px 72px), #e5ece8; overflow: hidden; }
    .player:nth-child(3) .portrait { background-color: #e9e9ef; }
    .portrait img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; position: relative; z-index: 1; }
    .fallback { position: absolute; inset: 0; display: grid; place-items: center; color: #7d9185; font-size: 36px; font-weight: 900; }
    .info { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 20px; }
    .name { font-size: 23px; font-weight: 900; display: block; overflow-wrap: anywhere; }
    .position { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
    .select-icon { color: var(--red); flex: 0 0 20px; width: 20px; height: 20px; }
    .player-details { display: block; text-align: left; font-size: 12px; line-height: 1.6; }
    .detail-section { display: block; padding: 12px 20px; border-top: 1px solid var(--line); }
    .detail-heading { display: block; font-size: 12px; font-weight: 800; margin-bottom: 6px; }
    .detail-row { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 2px 0; }
    .detail-label { flex: 0 0 54px; color: var(--muted); }
    .detail-value { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .detail-note { display: block; color: var(--muted); overflow-wrap: anywhere; }
    .detail-award { display: block; margin-bottom: 3px; overflow-wrap: anywhere; }
    .winner .player-details { max-width: 400px; margin: 0 auto 20px; }
    .bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; }
    .count { color: var(--muted); font-size: 12px; }
    .undo { background: transparent; border: 1px solid var(--line); border-radius: 4px; display: flex; align-items: center; gap: 7px; color: var(--ink); padding: 9px 12px; font-size: 12px; }
    .undo svg { width: 15px; height: 15px; }
    .undo:disabled { opacity: .35; cursor: default; }
    .winner { text-align: center; padding: 4px 0; }
    .winner .portrait { width: min(320px, 85%); margin: 0 auto 20px; border-bottom: 3px solid var(--red); }
    .winner h2 { font-size: 32px; margin: 0 0 8px; }
    .winner .position { margin-bottom: 24px; }
    .selection { position: absolute; inset: 0; z-index: 10; display: flex; justify-content: center; align-items: flex-start; background: #f5f7f6; }
    .selection .portrait { flex: 0 0 auto; background: transparent; }
    .restart { border: 0; border-radius: 4px; background: var(--red); color: #fff; padding: 13px 22px; font-weight: 700; }
    footer { border-top: 1px solid var(--line); margin-top: 30px; padding-top: 16px; color: var(--muted); font-size: 10px; line-height: 1.8; }
    footer details { margin-top: 8px; }
    footer summary { cursor: pointer; }
    footer ul { padding-left: 18px; }
    footer a { color: #356e59; margin-left: 8px; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      main { padding: 22px 16px; }
      .round { font-size: 40px; }
      .heading #title { font-size: 15px; }
      .heading { padding-top: 26px; }
      .match { grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr); }
      .versus { font-size: 26px; }
      .info { padding: 15px 11px; }
      .name { font-size: 18px; }
      .select-icon { display: none; }
      .detail-section { padding: 10px 11px; }
      .detail-label { flex-basis: 44px; }
      .player-details { font-size: 11px; }
      .portrait { aspect-ratio: 3 / 4; }
      .winner .portrait { aspect-ratio: 1; width: 240px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>

        { name: '양의지', position: '두산 · 포수', wiki: '양의지', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/151208._2015_KBO_%EA%B3%A8%EB%93%A0_%EA%B8%80%EB%9F%AC%EB%B8%8C_%EC%8B%9C%EC%83%81%EC%8B%9D._62.jpg/330px-151208._2015_KBO_%EA%B3%A8%EB%93%A0_%EA%B8%80%EB%9F%AC%EB%B8%8C_%EC%8B%9C%EC%83%81%EC%8B%9D._62.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail', imageSource: 'https://ko.wikipedia.org/wiki/%EC%96%91%EC%9D%98%EC%A7%80' },

        { name: '고영표', position: 'KT · 투수', wiki: '고영표', image: 'https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/%EA%B3%A0%EC%98%81%ED%91%9C_%EC%95%BC%EA%B5%AC_%EC%84%A0%EC%88%98.jpg/330px-%EA%B3%A0%EC%98%81%ED%91%9C_%EC%95%BC%EA%B5%AC_%EC%84%A0%EC%88%98.jpg?utm_source=ko.wikipedia.org&utm_campaign=api&utm_content=thumbnail', imageSource: 'https://ko.wikipedia.org/wiki/%EA%B3%A0%EC%98%81%ED%91%9C' },
        { name: '박종혁', position: 'KIA · 내야수', id: 56634, type: 'Hitter', image: 'https://tigers.co.kr/files/playerImg/tigersImg2/2026_28_C.png', imageSource: 'https://www.koreabaseball.com/Record/Player/HitterDetail/Basic.aspx?playerId=56634' },
        { name: '박준현', position: '키움 · 투수', id: 56318, type: 'Pitcher' },
        { name: '신재인', position: 'NC · 내야수', id: 56909, type: 'Hitter' },
        { name: '오재원', position: '한화 · 외야수', id: 56754, type: 'Hitter' },
        { name: '신동건', position: '롯데 · 투수', id: 56567, type: 'Pitcher' },
        { name: '김민준', position: 'SSG · 투수', id: 56840, type: 'Pitcher' },
        { name: '박지훈', position: 'KT · 투수', id: 56066, type: 'Pitcher' },
        { name: '김주오', position: '두산 · 외야수', id: 56266, type: 'Hitter' },
        { name: '양우진', position: 'LG · 투수', id: 56165, type: 'Pitcher' },
        { name: '이호범', position: '삼성 · 투수', id: 56441, type: 'Pitcher' },
        { name: '박한결', position: '키움 · 내야수', id: 56304, type: 'Hitter' }
      ];
      const highResolutionPhotos = {
        '구자욱': ['2026%2f9%2f202609042023770247_6a9aaa1c23195.jpg', 549658],
        '원태인': ['2026%2f10%2f202610272226779155_6ae0a68fd29df.jpg', 556492],
        '문동주': ['2026%2f5%2f202605301013779812_6a1a3dcf27b96.jpeg', 533321],
        '노시환': ['2026%2f9%2f202609180918771505_6aac83684dc13.jpg', 551811],
        '박준현': ['2025%2f9%2f202509171649778103_68ca67f0c86b2.jpg', 506951],
        '신재인': ['2025%2f9%2f202509171531770089_68ca55b8df4fd.jpg', 506923],
        '오재원': ['2025%2f9%2f202509171709771328_68ca6c9e8a717.jpg', 506957],
        '신동건': ['2025%2f9%2f202509171540774709_68ca57efce6e1.jpg', 506928],
        '김민준': ['2025%2f9%2f202509171548774736_68ca59cdee021.jpg', 506935],
        '박지훈': ['2025%2f9%2f202509171549772388_68ca59e1a5b24.jpg', 506937],
        '김주오': ['2025%2f9%2f202509171555770718_68ca5b7c77426.jpg', 506943],
        '양우진': ['2026%2f7%2f202607262135777425_6a65ff2814313.jpg', 543713],
        '박한결': ['2026%2f3%2f202603231503772222_69c0d7981c638.jpg', 520664]
      };
      for (const player of curatedPlayers) {
        const source = highResolutionPhotos[player.name];
        if (!source) continue;
        player.image = 'https://6ptotvmi5753.edge.naverncp.com/KBO_FILE/photo%2fimages%2f' + source[0];
        player.imageSource = 'https://www.koreabaseball.com/MediaNews/News/KboPhoto/View.aspx?bdSe=' + source[1];
      }
      const positions = ['투수', '포수', '내야수', '외야수'];
      const players = window.KBO_ROSTER.teams.flatMap(([team, groups]) => groups.flatMap((group, index) => group.map(([name, number]) => {
        const position = team + ' · ' + positions[index];
        const curated = curatedPlayers.find(player => player.name === name && player.position === position)
          || (name === '강백호' ? curatedPlayers.find(player => player.name === name) : null);
        return { ...curated, name, number, team, position, key: team + ':' + name + ':' + number, registered: true };
      })));
      for (const player of curatedPlayers.filter(player => player.id >= 56000 && player.id < 57000)) {
        if (players.some(candidate => candidate.name === player.name && candidate.position === player.position)) continue;
        players.push({ ...player, team: player.position.split(' · ')[0], key: 'draft:' + player.id, registered: false });
      }
      for (const [team, name, path, articleId] of window.KBO_ROSTER.fallbackPhotos) {
        const player = players.find(candidate => candidate.team === team && candidate.name === name);
        if (player && !player.image) {
          player.image = 'https://6ptotvmi5753.edge.naverncp.com/KBO_FILE/photo%2fimages%2f' + path;
          player.imageSource = 'https://www.koreabaseball.com/MediaNews/News/KboPhoto/View.aspx?bdSe=' + articleId;
        }
      }
      for (const [team, name, image, imageSource] of window.KBO_ROSTER.portraits) {
        const player = players.find(candidate => candidate.team === team && candidate.name === name);
        if (player) Object.assign(player, { image, imageSource, photoApproved: window.KBO_ROSTER.verifiedPortraits.includes(team + ':' + name) });
      }
      const byId = id => document.getElementById(id);
      const verifiedImages = new Map();
      const bracketSize = 16;
      let eligiblePlayers = [], starting = false;
      let selectionTimer = null;
      let round = [], winners = [], matchIndex = 0, champion = null, history = [];
      function loadImage(url) {
        return new Promise(resolve => {
          const image = new Image();
          const timeout = setTimeout(() => resolve(null), 12000);
          image.addEventListener('load', () => {
            clearTimeout(timeout);
            resolve(image.naturalWidth > 0 && image.naturalHeight > 0 ? image : null);
          }, { once: true });
          image.addEventListener('error', () => { clearTimeout(timeout); resolve(null); }, { once: true });
          image.src = url;
        });
      }
      async function verifyPhoto(player) {
        if (verifiedImages.has(player)) return true;
        let original = null;
        if (player.image && player.image.startsWith('https://thumb.wikimedia.org/wikipedia/commons/thumb/')) {
          const url = new URL(player.image);
          url.hostname = 'upload.wikimedia.org';
          url.pathname = url.pathname.replace('/commons/thumb/', '/commons/').split('/').slice(0, -1).join('/');
          url.search = '';
          original = url.href;
        }
        const sources = [...new Set([original, player.image, player.fallbackImage].filter(Boolean))];
        for (const source of sources) {
          const image = await loadImage(source);
          if (image && Math.min(image.naturalWidth, image.naturalHeight) >= 400) {
            player.image = source;
            if (source === player.fallbackImage) player.imageSource = player.fallbackImageSource;
            verifiedImages.set(player, image);
            return true;
          }
        }
        return false;
      }
      function portrait(player) {
        const frame = document.createElement('span');
        frame.className = 'portrait';
        const image = verifiedImages.get(player);
        image.alt = player.name;
        frame.append(image);
        return frame;
      }
      function getProfile(player) {
        const base = window.KBO_PROFILES.players[player.team + ':' + player.name + ':' + player.number]
          || window.KBO_PROFILES.players[player.team + ':' + player.name] || {};
        const official = window.KBO_VERIFIED_PROFILES?.players?.[player.team + ':' + player.name] || {};
        const namu = window.KBO_NAMU_PROFILES?.players?.[player.team + ':' + player.name] || {};
        return {
          ...base,
          ...official,
          ...namu,
          sources: [...new Set([...(official.sources || []), namu.source, ...(base.sources || [])].filter(Boolean))]
        };
      }
      function profileDetails(player) {
        const profile = getProfile(player);
        const container = document.createElement('span'); container.className = 'player-details';
        function section(title) {
          const block = document.createElement('span'); block.className = 'detail-section';
          const heading = document.createElement('span'); heading.className = 'detail-heading'; heading.textContent = title;
          block.append(heading); container.append(block); return block;
        }
        function row(block, label, value) {
          const line = document.createElement('span'); line.className = 'detail-row';
          const key = document.createElement('span'); key.className = 'detail-label'; key.textContent = label;
          const text = document.createElement('span'); text.className = 'detail-value';
          text.textContent = value ?? (profile.pageStatus === 'not_found' ? '문서 확인 불가' : '나무위키 미기재');
          line.append(key, text); block.append(line);
        }
        const basics = section('프로필');
        let age = null;
        if (profile.birthDate) {
          const [birthYear, birthMonth, birthDay] = profile.birthDate.split('-').map(Number);
          const [year, month, day] = window.KBO_PROFILES.asOf.split('-').map(Number);
          age = year - birthYear - (month < birthMonth || (month === birthMonth && day < birthDay) ? 1 : 0);
        }
        row(basics, '나이', age === null ? null : '만 ' + age + '세');
        row(basics, '키', profile.heightCm ? profile.heightCm + ' cm' : null);
        row(basics, '체중', profile.weightKg ? profile.weightKg + ' kg' : null);
        row(basics, '혈액형', profile.bloodType);
        row(basics, 'MBTI', profile.mbti);
        row(basics, '가족관계', profile.family);
        row(basics, '결혼여부', profile.maritalStatus);
        row(basics, '자녀수', profile.children === undefined || profile.children === null ? null : profile.children + '명');
        const awards = section('주요 수상');
        if (profile.awards?.length) {
          for (const award of profile.awards) {
            const text = document.createElement('span'); text.className = 'detail-award'; text.textContent = award; awards.append(text);
          }
        } else {
          const text = document.createElement('span'); text.className = 'detail-note';
          text.textContent = '확인된 수상 정보 없음'; awards.append(text);
        }
        const stats = section('2026 정규시즌');
        const season = profile.season2026;
        if (season) {
          const fields = season.type === 'Pitcher'
            ? [['경기', 'games'], ['평균자책', 'era'], ['승', 'wins'], ['패', 'losses'], ['탈삼진', 'strikeouts'], ['이닝', 'innings']]
            : [['경기', 'games'], ['타율', 'average'], ['홈런', 'homeRuns'], ['타점', 'rbi'], ['도루', 'stolenBases'], ['OPS', 'ops']];
          for (const [label, key] of fields) {
            if (season[key] !== undefined && season[key] !== null) row(stats, label, season[key]);
          }
          if (season.note) {
            const note = document.createElement('span'); note.className = 'detail-note'; note.textContent = season.note; stats.append(note);
          }
        } else {
          const text = document.createElement('span'); text.className = 'detail-note'; text.textContent = '확인된 2026 기록 없음'; stats.append(text);
        }
        return container;
      }
      function choose(player) {
        if (champion || starting || selectionTimer !== null) return;
        history.push({ round: [...round], winners: [...winners], matchIndex, champion });
        const origin = verifiedImages.get(player).getBoundingClientRect();
        const selection = byId('selection');
        const photo = portrait(player);
        const scale = Math.min(1.5, byId('match').clientWidth / origin.width);
        photo.style.width = origin.width * scale + 'px';
        photo.style.height = origin.height * scale + 'px';
        selection.replaceChildren(photo);
        selection.hidden = false;
        byId('undo').disabled = true;
        byId('match').querySelectorAll('button').forEach(button => { button.disabled = true; });
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          const target = photo.getBoundingClientRect();
          photo.animate([
            { transform: 'translate(' + (origin.left + origin.width / 2 - target.left - target.width / 2) + 'px, '
              + (origin.top + origin.height / 2 - target.top - target.height / 2) + 'px) scale('
              + origin.width / target.width + ', ' + origin.height / target.height + ')' },
            { transform: 'translate(0, 0) scale(1)' }
          ], { duration: 300, easing: 'ease-out' });
        }
        selectionTimer = setTimeout(() => {
          selectionTimer = null;
          selection.hidden = true;
          selection.replaceChildren();
          winners.push(player); matchIndex++;
          if (matchIndex === Math.floor(round.length / 2)) {
            if (winners.length === 1) champion = winners[0];
            else { round = winners; winners = round.length % 2 ? [round[round.length - 1]] : []; matchIndex = 0; }
          }
          render();
        }, 2000);
      }
      function render() {
        const done = history.length;
        const stage = round.length === 2 ? '결승' : round.length + '강';
        const stageMatches = Math.floor(round.length / 2);
        const completed = champion ? stageMatches : matchIndex;
        byId('bar').style.width = completed / stageMatches * 100 + '%';
        const progress = document.querySelector('[role="progressbar"]');
        progress.setAttribute('aria-valuemax', stageMatches);
        progress.setAttribute('aria-valuenow', completed);
        progress.setAttribute('aria-label', stage + ' 경기 진행률');
        byId('round').textContent = champion ? '최종 우승' : stage;
        byId('title').textContent = champion ? '당신의 최애 선수!' : '나의 최애 선수는?';
        byId('counter').textContent = champion ? 'WINNER' : (matchIndex + 1) + ' / ' + Math.floor(round.length / 2);
        byId('count').textContent = champion ? '우승 선정 완료' : stage + ' · ' + stageMatches + '경기 중 ' + completed + '경기 완료';
        byId('undo').disabled = !done;
        byId('match').hidden = !!champion; byId('winner').hidden = !champion;
        byId('match').replaceChildren(); byId('winner').replaceChildren();
        if (champion) {
          const name = document.createElement('h2'); name.textContent = champion.name;
          const position = document.createElement('span'); position.className = 'position'; position.textContent = champion.position;
          const restart = document.createElement('button'); restart.type = 'button'; restart.className = 'restart'; restart.textContent = '다시 시작'; restart.addEventListener('click', start);
          byId('winner').append(portrait(champion), name, position, profileDetails(champion), restart);
          restart.focus({ preventScroll: true });
          return;
        }
        round.slice(matchIndex * 2, matchIndex * 2 + 2).forEach((player, index) => {
          if (index) { const vs = document.createElement('div'); vs.className = 'versus'; vs.textContent = 'vs'; vs.setAttribute('aria-hidden', 'true'); byId('match').append(vs); }
          const button = document.createElement('button'); button.className = 'player'; button.type = 'button'; button.setAttribute('aria-label', player.name + ' 선택');
          const info = document.createElement('span'); info.className = 'info';
          const text = document.createElement('span');
          const name = document.createElement('span'); name.className = 'name'; name.textContent = player.name;
          const position = document.createElement('span'); position.className = 'position'; position.textContent = player.position;
          text.append(name, position); info.append(text);
          const icon = document.createElement('span'); icon.className = 'select-icon'; icon.textContent = '♡'; icon.setAttribute('aria-hidden', 'true'); info.append(icon);
          button.append(portrait(player), info, profileDetails(player)); button.addEventListener('click', () => choose(player)); byId('match').append(button);
        });
        if (done) byId('match').querySelector('button').focus({ preventScroll: true });
      }
      async function start() {
        if (starting || selectionTimer !== null) return;
        starting = true;
        byId('title').textContent = '참가자 사진 확인 중...';
        byId('round').textContent = '16강';
        byId('counter').textContent = '';
        byId('count').textContent = '사진 확인 0 / 16명';
        byId('undo').disabled = true;
        byId('winner').hidden = true;
        byId('match').hidden = false;
        byId('match').replaceChildren();
        try {
          const required = eligiblePlayers.filter(player =>
            (player.team === 'KIA' && ['김도영', '박종혁'].includes(player.name))
            || (player.team === 'NC' && player.name === '전사민'));
          if (eligiblePlayers.length < bracketSize || required.length !== 3) {
            showLoadingError('16강 참가자 사진이 부족합니다');
            return;
          }
          const candidates = eligiblePlayers.filter(player => !required.includes(player));
          for (let index = candidates.length - 1; index > 0; index--) {
            const other = Math.floor(Math.random() * (index + 1));
            [candidates[index], candidates[other]] = [candidates[other], candidates[index]];
          }
          const selected = [];
          let pending = [...required, ...candidates.splice(0, bracketSize - required.length)];
          while (pending.length) {
            let loaded = selected.length;
            const checked = await Promise.all(pending.map(async player => {
              const available = await verifyPhoto(player);
              if (available) byId('count').textContent = '사진 확인 ' + (++loaded) + ' / 16명';
              return { player, available };
            }));
            if (checked.some(result => required.includes(result.player) && !result.available)) {
              showLoadingError('김도영·박종혁·전사민 사진을 불러오지 못했습니다');
              return;
            }
            selected.push(...checked.filter(result => result.available).map(result => result.player));
            if (selected.length === bracketSize) break;
            pending = candidates.splice(0, bracketSize - selected.length);
          }
          if (selected.length !== bracketSize) {
            showLoadingError('불러올 수 있는 사진이 부족합니다');
            return;
          }
          round = selected;
          for (let index = round.length - 1; index > 0; index--) {
            const other = Math.floor(Math.random() * (index + 1));
            [round[index], round[other]] = [round[other], round[index]];
          }
          winners = []; matchIndex = 0; champion = null; history = []; render();
        } finally {
          starting = false;
        }
      }
      function showLoadingError(message) {
        byId('title').textContent = message;
        byId('count').textContent = '';
        const retry = document.createElement('button');
        retry.type = 'button'; retry.className = 'restart'; retry.textContent = '다시 불러오기';
        retry.addEventListener('click', start);
        byId('match').replaceChildren(retry);
      }
      byId('undo').addEventListener('click', () => {
        if (starting || selectionTimer !== null || !history.length) return;
        const previous = history.pop();
        round = previous.round; winners = previous.winners; matchIndex = previous.matchIndex; champion = previous.champion; render();
      });
      function renderSources() {
        byId('sources').replaceChildren();
        for (const player of eligiblePlayers) {
        const item = document.createElement('li'); item.textContent = player.name;
        if (player.wiki) {
          const wiki = document.createElement('a'); wiki.textContent = '위키백과';
          wiki.href = 'https://ko.wikipedia.org/wiki/' + encodeURIComponent(player.wiki);
          wiki.target = '_blank'; wiki.rel = 'noopener noreferrer';
          item.append(wiki);
        }
        for (const [index, url] of (getProfile(player).sources || []).entries()) {
          const source = document.createElement('a');
          source.textContent = url.includes('koreabaseball.com') ? 'KBO 프로필·기록' : url.includes('namu.wiki') ? '나무위키 프로필' : index ? '나무위키 기록' : '나무위키 프로필';
          source.href = url; source.target = '_blank'; source.rel = 'noopener noreferrer';
          item.append(source);
        }
        byId('sources').append(item);
        if (player.imageSource) {
          const source = document.createElement('a'); source.textContent = '사진 출처'; source.href = player.imageSource;
          source.target = '_blank'; source.rel = 'noopener noreferrer'; item.append(source);
        }
      }
      }
      function initialize() {
        const photoYear = window.KBO_ROSTER.date.slice(0, 4);
        for (const player of players) {
          const profile = window.KBO_PROFILES.players[player.team + ':' + player.name + ':' + player.number] || getProfile(player);
          const source = (profile.sources || []).map(value => new URL(value)).find(url =>
            url.hostname === 'www.koreabaseball.com' && url.searchParams.has('playerId'));
          const playerId = player.id || source?.searchParams.get('playerId');
          player.fallbackImage = playerId ? 'https://6ptotvmi5753.edge.naverncp.com/KBO_IMAGE/person/middle/' + photoYear + '/' + playerId + '.jpg' : null;
          player.fallbackImageSource = source?.href || (playerId ? 'https://www.koreabaseball.com/Record/Player/'
            + (player.position.endsWith('투수') ? 'Pitcher' : 'Hitter') + 'Detail/Basic.aspx?playerId=' + playerId : null);
          const reviewedPhoto = window.KBO_NAMU_PROFILES?.players?.[player.team + ':' + player.name]?.photo;
          const usablePhoto = reviewedPhoto && Math.min(reviewedPhoto.width, reviewedPhoto.height) >= 400;
          if (usablePhoto) {
            player.fallbackImage = reviewedPhoto.image;
            player.fallbackImageSource = reviewedPhoto.source;
          }
          if (!player.photoApproved) {
            player.image = usablePhoto ? reviewedPhoto.image : null;
            player.imageSource = usablePhoto ? reviewedPhoto.source : null;
          }
        }
        const foreignPlayers = new Set([
          'KT:스기모토', 'KT:대니엘', 'KT:로건', 'KT:힐리어드',
          '삼성:페덱', '삼성:사토시', '삼성:후라도', '삼성:디아즈',
          'KIA:올러', 'KIA:네일', 'KIA:시라카와', 'KIA:카스트로',
          'LG:톨허스트', 'LG:카라스코', 'LG:케네디', 'LG:오스틴',
          '두산:타카다', '두산:잭로그', '두산:벤자민', '두산:세베리노',
          'SSG:타케다', 'SSG:아빌라', 'SSG:에레디아',
          '롯데:비슬리', '롯데:로드리게스', '롯데:이이무라', '롯데:레이예스',
          'NC:클레빈저', 'NC:토다', 'NC:라일리', 'NC:블레인',
          '한화:짐머맨', '한화:화이트', '한화:페라자',
          '키움:유토', '키움:히우라', '키움:데이비슨'
        ]);
        eligiblePlayers = players.filter(player => player.image
          && !foreignPlayers.has(player.team + ':' + player.name));
        renderSources();
        start();
      }
      initialize();
    })();
  </script>
